<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة الدروس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFE9DD;
    --surface:#FFFFFF;
    --surface-alt:#F7F3E8;
    --primary:#16324F;
    --primary-light:#23456B;
    --accent:#B8862B;
    --accent-light:#D9A93E;
    --success:#3E7C59;
    --success-bg:#E7F1EA;
    --danger:#B5482A;
    --danger-bg:#F7E7E1;
    --text:#1E1B16;
    --text-muted:#6B6459;
    --border:#DED5C2;
    --radius:14px;
    --shadow:0 4px 16px rgba(22,50,79,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh;
    line-height:1.6;
  }
  h1,h2,h3,.display{
    font-family:'Tajawal', sans-serif;
    font-weight:900;
    color:var(--primary);
  }
  #app{min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- top bar ---------- */
  .topbar{
    background:var(--primary);
    color:#fff;
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:var(--shadow);
  }
  .topbar .brand{
    font-family:'Tajawal', sans-serif;
    font-weight:900;
    font-size:20px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent-light);display:inline-block;}
  .topbar .user-box{display:flex; align-items:center; gap:14px; font-size:14px;}
  .role-badge{
    background:var(--accent);
    color:var(--primary);
    font-weight:700;
    padding:4px 12px;
    border-radius:999px;
    font-size:12px;
  }
  .btn-ghost{
    background:transparent;
    border:1px solid rgba(255,255,255,0.4);
    color:#fff;
    padding:8px 16px;
    border-radius:10px;
    cursor:pointer;
    font-family:inherit;
    font-size:14px;
    transition:.15s;
  }
  .btn-ghost:hover{background:rgba(255,255,255,0.12);}

  /* ---------- layout ---------- */
  .main-wrap{flex:1; display:flex; width:100%; max-width:1200px; margin:0 auto;}
  .content{flex:1; padding:28px 24px 60px;}

  .tabs{
    display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap;
    border-bottom:2px solid var(--border);
    padding-bottom:0;
  }
  .tab-btn{
    background:transparent;
    border:none;
    padding:12px 18px;
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--text-muted);
    cursor:pointer;
    border-bottom:3px solid transparent;
    margin-bottom:-2px;
    transition:.15s;
  }
  .tab-btn.active{color:var(--primary); border-bottom-color:var(--accent);}
  .tab-btn:hover{color:var(--primary);}

  /* ---------- cards / surfaces ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:var(--shadow);
  }
  .card + .card{margin-top:16px;}
  .section-title{font-size:20px; margin-bottom:16px;}
  .muted{color:var(--text-muted); font-size:14px;}

  /* forms */
  label{display:block; font-size:13px; font-weight:600; color:var(--primary); margin-bottom:6px;}
  input, select, textarea{
    width:100%;
    padding:11px 14px;
    border:1.5px solid var(--border);
    border-radius:10px;
    font-family:inherit;
    font-size:15px;
    background:var(--surface-alt);
    color:var(--text);
    transition:.15s;
  }
  input:focus, select:focus, textarea:focus{
    outline:none; border-color:var(--accent); background:#fff;
  }
  .field{margin-bottom:14px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:600px){.row2{grid-template-columns:1fr;}}

  .btn{
    background:var(--primary);
    color:#fff;
    border:none;
    padding:12px 22px;
    border-radius:10px;
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:.15s;
  }
  .btn:hover{background:var(--primary-light);}
  .btn-accent{background:var(--accent); color:var(--primary);}
  .btn-accent:hover{background:var(--accent-light);}
  .btn-danger{background:var(--danger-bg); color:var(--danger);}
  .btn-danger:hover{background:#f0d5c8;}
  .btn-sm{padding:7px 14px; font-size:13px; border-radius:8px;}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  /* auth screen */
  .auth-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .auth-card{
    background:var(--surface);
    border-radius:20px;
    box-shadow:var(--shadow);
    width:100%; max-width:440px;
    padding:36px 32px;
    border:1px solid var(--border);
  }
  .auth-logo{text-align:center; margin-bottom:6px;}
  .auth-logo .display{font-size:26px;}
  .auth-sub{text-align:center; color:var(--text-muted); font-size:14px; margin-bottom:24px;}
  .role-toggle{display:flex; background:var(--surface-alt); border-radius:10px; padding:4px; margin-bottom:20px;}
  .role-toggle button{
    flex:1; padding:10px; border:none; background:transparent; border-radius:8px;
    font-family:'Tajawal'; font-weight:700; cursor:pointer; color:var(--text-muted); font-size:14px;
  }
  .role-toggle button.active{background:var(--primary); color:#fff;}
  .mode-switch{text-align:center; margin-top:18px; font-size:14px; color:var(--text-muted);}
  .mode-switch a{color:var(--accent); font-weight:700; cursor:pointer; text-decoration:underline;}
  .alert{
    padding:11px 14px; border-radius:10px; font-size:13px; margin-bottom:14px;
  }
  .alert-error{background:var(--danger-bg); color:var(--danger);}
  .alert-success{background:var(--success-bg); color:var(--success);}

  /* ticket card - signature element for slots */
  .ticket{
    display:flex;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .ticket-main{flex:1; padding:16px 18px;}
  .ticket-date{font-family:'Tajawal'; font-weight:800; font-size:16px; color:var(--primary);}
  .ticket-time{color:var(--text-muted); font-size:14px; margin-top:2px;}
  .ticket-stub{
    width:120px;
    background:var(--surface-alt);
    border-right:2px dashed var(--border);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    padding:10px;
  }
  .ticket-stub::before, .ticket-stub::after{
    content:''; position:absolute; width:16px; height:16px; border-radius:50%;
    background:var(--bg); right:-9px;
  }
  .ticket-stub::before{top:-9px;}
  .ticket-stub::after{bottom:-9px;}
  .status-pill{
    font-size:12px; font-weight:700; padding:5px 10px; border-radius:999px; white-space:nowrap;
  }
  .status-open{background:var(--success-bg); color:var(--success);}
  .status-booked{background:var(--danger-bg); color:var(--danger);}

  /* video cards */
  .video-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:18px;}
  .video-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
  .video-frame-wrap{position:relative; width:100%; padding-top:56.25%; background:#000;}
  .video-frame-wrap iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .video-info{padding:14px 16px;}
  .video-title{font-family:'Tajawal'; font-weight:800; font-size:15px; color:var(--primary); margin-bottom:4px;}
  .video-desc{font-size:13px; color:var(--text-muted);}
  .video-actions{display:flex; gap:8px; margin-top:10px;}

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--text-muted);
  }
  .empty-state .icon{font-size:40px; margin-bottom:12px;}

  .list-item-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 0; border-bottom:1px solid var(--border);
  }
  .list-item-row:last-child{border-bottom:none;}

  .toast-wrap{position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:999; display:flex; flex-direction:column; gap:8px;}
  .toast{
    padding:12px 20px; border-radius:10px; font-size:14px; font-weight:600;
    box-shadow:var(--shadow); animation:slideIn .2s ease-out;
  }
  .toast.ok{background:var(--success); color:#fff;}
  .toast.err{background:var(--danger); color:#fff;}
  @keyframes slideIn{from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);}}

  .lock-box{
    text-align:center; padding:50px 24px; color:var(--text-muted);
  }
  .lock-box .icon{font-size:42px; margin-bottom:14px;}

  .loading-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    color:var(--text-muted); font-family:'Tajawal'; font-weight:700; font-size:16px;
  }
  footer.note{text-align:center; padding:18px; color:var(--text-muted); font-size:12px;}

  /* grade chips / checkbox groups */
  .chip-group{display:flex; flex-wrap:wrap; gap:8px;}
  .chip-check{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface-alt); border:1.5px solid var(--border);
    border-radius:999px; padding:7px 14px; cursor:pointer; font-size:13px; font-weight:600;
    transition:.15s;
  }
  .chip-check input{width:auto; margin:0;}
  .chip-check.checked{background:var(--primary); border-color:var(--primary); color:#fff;}
  .student-pick-list{
    max-height:220px; overflow-y:auto; border:1.5px solid var(--border); border-radius:10px;
    background:var(--surface-alt); padding:6px;
  }
  .student-pick-row{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; cursor:pointer;
  }
  .student-pick-row:hover{background:#fff;}
  .student-pick-row input{width:auto;}
  .audience-tag{
    display:inline-block; background:var(--surface-alt); color:var(--primary);
    border:1px solid var(--border); border-radius:999px; padding:3px 10px; font-size:11px; font-weight:700;
    margin:2px 4px 0 0;
  }
</style>
</head>
<body>
<div id="app"><div class="loading-screen">جارِ التحميل…</div></div>

<script>
(function(){
  "use strict";

  // بيانات دخول المدرّس الثابتة - مفيش تسجيل حساب مدرّس جديد، الدخول بيتم بالبيانات دي بس. غيّرها لو حبيت
  var TEACHER_USERNAME = "teacher";
  var TEACHER_PASSWORD = "Teacher@2026";

  var GRADES = ['G4','G5','G6','G7','G8','G9'];
  var GRADE_LABELS = {
    G4:'الصف الرابع الابتدائي',
    G5:'الصف الخامس الابتدائي',
    G6:'الصف السادس الابتدائي',
    G7:'الصف الأول الإعدادي',
    G8:'الصف الثاني الإعدادي',
    G9:'الصف الثالث الإعدادي'
  };

  var state = {
    ready:false,
    users:{},
    videos:[],
    slots:[],
    exams:[],            // للمدرّس: الامتحانات كاملة (مع الإجابات الصح)
    examAttempts:[],      // للمدرّس: نتايج الطلاب
    studentExams:[],      // للطالب: الامتحانات المتاحة ليه (من غير الإجابات الصح)
    activeExam:null,      // الامتحان اللي الطالب بيمتحن فيه دلوقتي
    examTimerInterval:null,
    currentUser:null,   // {name,email,password,role,grade}
    authMode:'login',   // 'login' | 'signup'
    authRole:'student',
    dashTab:null,
    editingStudentEmail:null,
    error:''
  };

  var app = document.getElementById('app');

  // ---------------- backend (Google Apps Script + Google Sheet) ----------------
  // بعد ما تعمل الـ Apps Script ديبلوي (شرح الخطوات في آخر الرسالة)، حط الرابط هنا:
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwWW3WKC7ffuOf7TJ2jl5epAPmhBKfctGCMMJoLewiwGts0vZsSzTUJ3gaDb8dlKMT1zw/exec';

  async function apiGet(action, params){
    var qs = 'action=' + encodeURIComponent(action);
    params = params || {};
    Object.keys(params).forEach(function(k){ qs += '&' + k + '=' + encodeURIComponent(params[k]); });
    var res = await fetch(APPS_SCRIPT_URL + '?' + qs);
    return res.json();
  }

  async function apiPost(action, payload, attempt){
    attempt = attempt || 1;
    payload = payload || {};
    payload.action = action;
    try{
      var res = await fetch(APPS_SCRIPT_URL, {
        method:'POST',
        // text/plain مهم عشان يتجنب preflight/CORS بتاع Apps Script
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(payload)
      });
      var data = await res.json();
      return data;
    }catch(e){
      if(attempt < 4){
        await new Promise(function(r){ setTimeout(r, 400 * attempt); });
        return apiPost(action, payload, attempt + 1);
      }
      return {ok:false, error:'حصلت مشكلة في الاتصال، حاول تاني'};
    }
  }

  async function loadAll(){
    try{
      var res = await apiGet('load');
      if(res && res.ok){
        state.users = res.users || {};
        state.videos = res.videos || [];
        state.slots = res.slots || [];
      } else {
        showToast('حصلت مشكلة في تحميل البيانات', 'err');
      }
    }catch(e){
      showToast('حصلت مشكلة في الاتصال، تأكد من النت', 'err');
    }
    state.ready = true;
  }

  // ---------------- toast ----------------
  function showToast(msg, type){
    var wrap = document.querySelector('.toast-wrap');
    if(!wrap){
      wrap = document.createElement('div');
      wrap.className = 'toast-wrap';
      document.body.appendChild(wrap);
    }
    var t = document.createElement('div');
    t.className = 'toast ' + (type === 'err' ? 'err' : 'ok');
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(function(){ t.remove(); }, 3000);
  }

  // ---------------- utils ----------------
  function esc(str){
    var d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }
  function uid(){ return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

  function ytEmbed(url){
    if(!url) return '';
    url = url.trim();
    // بارامترات بتقلل شعار يوتيوب وأي اقتراحات فيديوهات تانية في الآخر،
    // عشان الفيديو يبان جزء من المنصة قد الإمكان (مينفعش يتشال خالص، ده من شروط يوتيوب)
    var params = 'modestbranding=1&rel=0&iv_load_policy=3&playsinline=1&color=white&fs=1';
    try{
      var id = '';
      if(url.indexOf('youtu.be/') !== -1){
        id = url.split('youtu.be/')[1].split(/[?&]/)[0];
      } else if(url.indexOf('watch?v=') !== -1){
        id = url.split('watch?v=')[1].split('&')[0];
      } else if(url.indexOf('/embed/') !== -1){
        id = url.split('/embed/')[1].split(/[?&]/)[0];
      } else if(url.indexOf('/shorts/') !== -1){
        id = url.split('/shorts/')[1].split(/[?&]/)[0];
      }
      // youtube-nocookie.com نسخة أخف من ناحية التتبع وبراندينج يوتيوب
      if(id) return 'https://www.youtube-nocookie.com/embed/' + id + '?' + params;
      return url;
    }catch(e){ return url; }
  }

  function fmtDate(dateStr){
    try{
      var d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('ar-EG', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
    }catch(e){ return dateStr; }
  }

  function sortedSlots(){
    return state.slots.slice().sort(function(a,b){
      return (a.date+a.time).localeCompare(b.date+b.time);
    });
  }

  function isFuture(slot){
    var now = new Date();
    var slotDt = new Date(slot.date + 'T' + slot.time);
    return slotDt.getTime() >= now.getTime() - 60*1000;
  }

  function gradeOptionsHtml(selected){
    var html = '';
    GRADES.forEach(function(g){
      html += '<option value="' + g + '"' + (g === selected ? ' selected' : '') + '>' + GRADE_LABELS[g] + '</option>';
    });
    return html;
  }

  // ---------------- render dispatcher ----------------
  function render(){
    if(!state.ready){
      app.innerHTML = '<div class="loading-screen">جارِ التحميل…</div>';
      return;
    }
    if(!state.currentUser){
      renderAuth();
    } else if(state.currentUser.role === 'teacher'){
      renderTeacherDash();
    } else {
      renderStudentDash();
    }
  }

  // ================= AUTH SCREEN =================
  function renderAuth(){
    var isLogin = state.authMode === 'login';

    var html = '';
    html += '<div class="auth-wrap"><div class="auth-card">';
    html += '<div class="auth-logo display">📚 منصة الدروس</div>';
    html += '<div class="auth-sub">' + (isLogin ? 'سجّل دخولك عشان تكمل' : 'اعمل حساب طالب جديد وابدأ') + '</div>';

    if(state.error){
      html += '<div class="alert alert-error">' + esc(state.error) + '</div>';
    }

    html += '<form id="authForm">';
    if(!isLogin){
      html += '<div class="field"><label>البريد الإلكتروني</label><input type="text" id="f_email" placeholder="example@email.com" required></div>';
      html += '<div class="field"><label>رقم الموبايل</label><input type="tel" id="f_phone" placeholder="01xxxxxxxxx" required></div>';
      html += '<div class="muted" style="margin:-4px 0 14px;">دلوقتي اعمل باسورد لمنصتك واسم ليك:</div>';
      html += '<div class="field"><label>كلمة المرور</label><input type="password" id="f_pass" placeholder="••••••••" minlength="4" required></div>';
      html += '<div class="field"><label>الاسم</label><input type="text" id="f_name" placeholder="اكتب اسمك" required></div>';
      html += '<div class="field"><label>الصف الدراسي</label><select id="f_grade" required><option value="">اختار صفك الدراسي</option>' + gradeOptionsHtml(null) + '</select></div>';
    } else {
      html += '<div class="field"><label>البريد الإلكتروني</label><input type="text" id="f_email" placeholder="البريد الإلكتروني الخاص بيك" required></div>';
      html += '<div class="field"><label>كلمة المرور</label><input type="password" id="f_pass" placeholder="••••••••" minlength="4" required></div>';
    }
    html += '<button type="submit" class="btn btn-block">' + (isLogin ? 'دخول' : 'إنشاء الحساب') + '</button>';
    html += '</form>';

    html += '<div class="mode-switch">';
    if(isLogin){
      html += 'مفيش حساب لسه؟ <a id="toSignup">اعمل حساب جديد</a>';
    } else {
      html += 'عندك حساب؟ <a id="toLogin">سجّل دخولك</a>';
    }
    html += '</div>';

    html += '</div></div>';
    app.innerHTML = html;

    var toSignup = document.getElementById('toSignup');
    if(toSignup) toSignup.addEventListener('click', function(){
      state.authMode='signup'; state.error=''; renderAuth();
    });
    var toLogin = document.getElementById('toLogin');
    if(toLogin) toLogin.addEventListener('click', function(){
      state.authMode='login'; state.error=''; renderAuth();
    });

    document.getElementById('authForm').addEventListener('submit', function(e){
      e.preventDefault();
      var btn = e.target.querySelector('button[type="submit"]');
      if(btn){ btn.disabled = true; btn.textContent = 'جاري الحفظ...'; }
      var done = function(){ if(btn){ btn.disabled = false; btn.textContent = isLogin ? 'دخول' : 'إنشاء الحساب'; } };
      var p = isLogin ? handleLogin() : handleSignup();
      Promise.resolve(p).then(done, done);
    });
  }

  async function handleSignup(){
    var name = document.getElementById('f_name').value.trim();
    var email = document.getElementById('f_email').value.trim().toLowerCase();
    var phone = document.getElementById('f_phone').value.trim();
    var pass = document.getElementById('f_pass').value;
    var gradeEl = document.getElementById('f_grade');
    var grade = gradeEl ? gradeEl.value : '';

    if(!name || !email || !phone || !pass){
      state.error = 'من فضلك املأ كل الحقول'; renderAuth(); return;
    }
    if(!grade){
      state.error = 'من فضلك اختار الصف الدراسي'; renderAuth(); return;
    }
    if(email === TEACHER_USERNAME.toLowerCase()){
      state.error = 'في حساب موجود بالفعل بالإيميل ده'; renderAuth(); return;
    }

    // التسجيل بيتم من جوه السيرفر نفسه بقفل (lock) - يعني حتى لو طالبين
    // سجّلوا بنفس اللحظة بالظبط، السيرفر بيعالجهم واحد ورا التاني ومفيش
    // احتمال إن حساب يضيع أو يتكتب فوق التاني
    var res = await apiPost('register', {name:name, email:email, phone:phone, password:pass, grade:grade});
    if(!res || !res.ok){
      state.error = (res && res.error) ? res.error : 'حصلت مشكلة في حفظ الحساب، حاول تاني';
      renderAuth();
      return;
    }

    state.users[email] = res.user;
    state.currentUser = res.user;
    state.error = '';

  async function handleLogin(){
    var input = document.getElementById('f_email').value.trim();
    var pass = document.getElementById('f_pass').value;

    if(input.toLowerCase() === TEACHER_USERNAME.toLowerCase() && pass === TEACHER_PASSWORD){
      state.currentUser = {name:'المدرّس', email:TEACHER_USERNAME, role:'teacher'};
      state.error = '';
      state.dashTab = null;
      // نجيب أحدث نسخة من البيانات لما المدرّس يدخل عشان يشوف كل حاجة محدثة
      await loadAll();
      render();
      return;
    }

    var email = input.toLowerCase();
    var res = await apiPost('login', {email:email, password:pass});
    if(!res || !res.ok){
      state.error = (res && res.error) ? res.error : 'البيانات اللي دخلتها غلط';
      renderAuth();
      return;
    }
    state.users[email] = res.user;
    state.currentUser = res.user;
    state.error = '';
    state.dashTab = null;
    render();
  }

  function handleLogout(){
    if(state.examTimerInterval){ clearInterval(state.examTimerInterval); state.examTimerInterval = null; }
    state.activeExam = null;
    state.currentUser = null;
    state.authMode = 'login';
    state.error = '';

  }

  function fmtDeadline(iso){

    }catch(e){ return iso; }

  function bindTabs(rerenderFn){

  function bindTeacherExams(){
    var container = document.getElementById('questionsContainer');
    if(container && container.children.length === 0){
      addQuestionBlock();
      addQuestionBlock();
    }
    var addBtn = document.getElementById('addQBtn');
    if(addBtn) addBtn.addEventListener('click', addQuestionBlock);

    app.querySelectorAll('#examGradeChips .chip-check').forEach(function(chip){
      var box = chip.querySelector('input');
      box.addEventListener('change', function(){ chip.classList.toggle('checked', box.checked); });
    });

    var form = document.getElementById('examForm');
    if(form) form.addEventListener('submit', async function(e){
      e.preventDefault();
      var title = document.getElementById('e_title').value.trim();
      var desc = document.getElementById('e_desc').value.trim();
      var duration = parseInt(document.getElementById('e_duration').value, 10);
      var deadlineVal = document.getElementById('e_deadline').value;
      var deadline = deadlineVal ? new Date(deadlineVal).toISOString() : null;

      if(!title || !duration || duration < 1){ showToast('اكتب عنوان ومدة صحيحة', 'err'); return; }

      var grades = Array.prototype.slice.call(app.querySelectorAll('.examGradeChk:checked')).map(function(el){ return el.value; });
      var studentsSel = Array.prototype.slice.call(app.querySelectorAll('.examStudentChk:checked')).map(function(el){ return el.value; });

      var questions = [];
      var valid = true;
      app.querySelectorAll('#questionsContainer .examQuestionBlock').forEach(function(b){
        var text = b.querySelector('.qText').value.trim();
        var correctRadio = b.querySelector('.qCorrect:checked');
        var correctIdx = correctRadio ? parseInt(correctRadio.value, 10) : -1;
        var options = Array.prototype.map.call(b.querySelectorAll('.qOption'), function(inp){ return inp.value.trim(); });
        var filledOptions = [];
        var newCorrectIdx = -1;
        options.forEach(function(opt, idx){
          if(opt){
            if(idx === correctIdx) newCorrectIdx = filledOptions.length;
            filledOptions.push(opt);
          }
        });
        if(!text || filledOptions.length < 2 || newCorrectIdx === -1){ valid = false; return; }
        questions.push({id: uid(), text: text, options: filledOptions, correctIndex: newCorrectIdx});
      });

      if(!valid || questions.length === 0){
        showToast('كل سؤال لازم نص + اختيارين على الأقل + تحديد الإجابة الصح', 'err');
        return;
      }

      var exam = {
        id: uid(), title: title, description: desc, durationMinutes: duration,
        deadline: deadline, grades: grades, students: studentsSel,
        questions: questions, createdAt: Date.now()
      };

      var res = await apiPost('saveExam', {exam: exam});
      if(res && res.ok){
        state.exams.push(exam);
        showToast('اتنشر الامتحان بنجاح', 'ok');
        renderTeacherDash();
      } else {
        showToast((res && res.error) ? res.error : 'حصلت مشكلة في الحفظ، حاول تاني', 'err');
      }
    });

    app.querySelectorAll('.delExamBtn').forEach(function(b){
      b.addEventListener('click', async function(){
        var id = b.getAttribute('data-exam');
        if(!confirm('متأكد إنك عايز تحذف الامتحان ده؟ هيتحذف معاه نتايج الطلاب اللي خدوه.')) return;
        var res = await apiPost('deleteExam', {examId: id});
        if(res && res.ok){
          state.exams = state.exams.filter(function(x){ return x.id !== id; });
          state.examAttempts = state.examAttempts.filter(function(a){ return a.examId !== id; });
          showToast('اتحذف الامتحان', 'ok');
          renderTeacherDash();
        } else {
          showToast('حصلت مشكلة في الحذف، حاول تاني', 'err');
        }
      });
    });

    app.querySelectorAll('.resultsBtn').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-exam');
        var box = document.getElementById('results_' + id);
        if(!box) return;
        if(box.style.display === 'block'){ box.style.display = 'none'; return; }
        var exam = state.exams.find(function(x){ return x.id === id; });
        var attempts = state.examAttempts.filter(function(a){ return a.examId === id; });
        var html = '';
        if(attempts.length === 0){
          html = '<div class="muted">لسه محدش دخل الامتحان ده</div>';
        } else {
          attempts.forEach(function(a){
            var u = state.users[a.studentEmail];
            html += '<div class="list-item-row" style="display:block;">';
            html += '<div style="display:flex; justify-content:space-between; align-items:center;">';
            html += '<div>' + esc(u ? u.name : a.studentEmail) + '<div class="muted">' + esc(a.studentEmail) + '</div></div>';
            if(a.submittedAt){
              html += '<div style="display:flex; align-items:center; gap:8px;">';
              html += '<span class="status-pill status-open">' + esc(a.score) + ' / ' + esc(a.total) + '</span>';
              html += '<button type="button" class="btn btn-sm answerDetailsBtn" data-exam="' + id + '" data-student="' + esc(a.studentEmail) + '">إجاباته</button>';
              html += '</div>';
            } else {
              html += '<span class="status-pill status-booked">لسه بيمتحن</span>';
            }
            html += '</div>';
            html += '<div class="answerDetailsBox" id="ans_' + id + '_' + a.studentEmail.replace(/[^a-z0-9]/gi,'_') + '" style="display:none; margin-top:10px;"></div>';
            html += '</div>';
          });
        }
        box.innerHTML = html;
        box.style.display = 'block';
        bindAnswerDetails(exam, attempts);
      });
    });
  }

  function bindAnswerDetails(exam, attempts){
    app.querySelectorAll('.answerDetailsBtn').forEach(function(b){
      b.addEventListener('click', function(){
        var studentEmail = b.getAttribute('data-student');
        var boxId = 'ans_' + b.getAttribute('data-exam') + '_' + studentEmail.replace(/[^a-z0-9]/gi,'_');
        var box = document.getElementById(boxId);
        if(!box) return;
        if(box.style.display === 'block'){ box.style.display = 'none'; return; }
        var attempt = attempts.find(function(a){ return a.studentEmail === studentEmail; });
        if(!exam || !attempt){ return; }
        var html = '';
        exam.questions.forEach(function(q, qi){
          var selected = attempt.answers ? attempt.answers[qi] : undefined;
          var correct = selected !== undefined && selected !== null && Number(selected) === Number(q.correctIndex);
          html += '<div style="padding:10px 0; border-bottom:1px solid var(--border);">';
          html += '<div style="font-weight:700; margin-bottom:6px;">' + (qi+1) + '. ' + esc(q.text) + '</div>';
          q.options.forEach(function(opt, oi){
            var tag = '';
            if(oi === q.correctIndex) tag = ' ✅ (الإجابة الصح)';
            if(oi === selected && !correct) tag = ' ❌ (اختيار الطالب)';
            else if(oi === selected && correct) tag = ' ✅ (اختيار الطالب - صح)';
            var style = (oi === q.correctIndex) ? 'color:var(--success); font-weight:700;' : (oi === selected ? 'color:var(--danger); font-weight:700;' : 'color:var(--text-muted);');
            html += '<div style="' + style + ' font-size:13px; margin-right:12px;">' + esc(opt) + tag + '</div>';
          });
          if(selected === undefined || selected === null){
            html += '<div class="muted" style="font-size:12px; margin-top:4px;">الطالب مجاوبش على السؤال ده</div>';
          }
          html += '</div>';
        });
        box.innerHTML = html;
        box.style.display = 'block';
      });
    });
  }

  async function startExamFlow(examId){

      showToast((res && res.error) ? res.error : 'حصلت مشكلة، حاول تاني', 'err');
      return;
    }
    if(res.status === 'submitted'){
      exam.attemptStatus = 'submitted'; exam.score = res.score; exam.total = res.total;
      renderStudentDash();
      return;
    }
    state.activeExam = {
      examId: examId,
      title: exam.title,
      questions: exam.questions,
      durationMinutes: res.durationMinutes || exam.durationMinutes,
      startedAt: res.startedAt,
      answers: res.savedAnswers || []

  function bindExamTaking(){
    var progressTimeout = null;
    app.querySelectorAll('.examAnswer').forEach(function(inp){
      inp.addEventListener('change', function(){
        var qi = parseInt(inp.getAttribute('data-qi'), 10);
        state.activeExam.answers[qi] = parseInt(inp.value, 10);
        clearTimeout(progressTimeout);
        progressTimeout = setTimeout(function(){
          apiPost('saveProgress', {examId: state.activeExam.examId, studentEmail: state.currentUser.email, answers: state.activeExam.answers});
        }, 700);
      });
    });
    var submitBtn = document.getElementById('submitExamBtn');
    if(submitBtn) submitBtn.addEventListener('click', function(){
      if(!confirm('متأكد إنك عايز تسلّم الامتحان؟ مش هتقدر تعدّل بعد كده.')) return;
      finishExam();
    });
  }

  function startExamTimer(){
    if(state.examTimerInterval) clearInterval(state.examTimerInterval);
    state.examTimerInterval = setInterval(updateExamTimer, 1000);
    updateExamTimer();
  }

  function updateExamTimer(){
    if(!state.currentUser || !state.activeExam){
      clearInterval(state.examTimerInterval);
      return;
    }
    var ex = state.activeExam;
    var started = new Date(ex.startedAt).getTime();
    var durationMs = (ex.durationMinutes || 0) * 60000;
    var remaining = Math.max(0, started + durationMs - Date.now());
    var el = document.getElementById('examTimer');
    if(el){
      var mins = Math.floor(remaining / 60000);
      var secs = Math.floor((remaining % 60000) / 1000);
      el.textContent = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
      el.style.color = remaining <= 60000 ? 'var(--danger)' : 'var(--primary)';
    }
    if(remaining <= 0){
      clearInterval(state.examTimerInterval);
      showToast('خلص وقت الامتحان، هيتسلّم تلقائيًا', 'err');
      finishExam();
    }
  }

  async function finishExam(){
    var ex = state.activeExam;
    if(!ex) return;
    var res = await apiPost('submitExam', {examId: ex.examId, studentEmail: state.currentUser.email, answers: ex.answers});
    if(res && res.ok){
      var studentEx = state.studentExams.find(function(e){ return e.id === ex.examId; });
      if(studentEx){ studentEx.attemptStatus = 'submitted'; studentEx.score = res.score; studentEx.total = res.total; }
      renderExamResult(res.score, res.total, ex.title);
    } else {
      showToast((res && res.error) ? res.error : 'حصلت مشكلة في التسليم، حاول تاني', 'err');
    }
  }

  function renderExamResult(score, total, title){
    if(state.examTimerInterval) clearInterval(state.examTimerInterval);
    state.activeExam = null;
    var html = topbarHtml();
    html += '<div class="main-wrap"><div class="content">';
    html += '<div class="card" style="text-align:center; padding:50px 24px;">';
    html += '<div style="font-size:48px; margin-bottom:14px;">🎉</div>';
    html += '<div class="section-title">اتسلّم امتحان "' + esc(title) + '"</div>';
    html += '<div style="font-family:\'Tajawal\'; font-weight:900; font-size:32px; color:var(--primary); margin:14px 0;">' + esc(score) + ' / ' + esc(total) + '</div>';
    html += '<button class="btn btn-accent" id="backToExamsBtn">رجوع للامتحانات</button>';
    html += '</div></div></div>';
    app.innerHTML = html;
    bindLogout();
    var b = document.getElementById('backToExamsBtn');
    if(b) b.addEventListener('click', async function(){
      state.dashTab = 'exams';
      await loadExamsForStudent();
      renderStudentDash();
    });
  }

  // ---------------- init ----------------
  loadAll().then(render).catch(function(){
    app.innerHTML = '<div class="loading-screen">حصلت مشكلة في تحميل البيانات، جرّب تحدّث الصفحة</div>';
  });

})();
</script>
</body>
</html>
